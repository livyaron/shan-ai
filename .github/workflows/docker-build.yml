name: docker-build
# Railway builds this same Dockerfile on every push to master. When that build
# breaks, Railway keeps serving the previous container — master moves ahead and
# nothing says otherwise. This runs the build in CI so a broken image is a red
# check within minutes instead of a silently stale deployment.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image Railway builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: shan-ai:ci

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt
      - name: Import the app the way uvicorn does
        run: python -c "import app.main; print('app imports cleanly')"
      - name: Run the tests that need no database
        # Every test under tests/ except those conftest marks `db` (they request
        # the Postgres engine). No hand-kept file list: a new test runs by default.
        run: python -m pytest -q -m "not db" tests/

  lessons-ui:
    # The Docker build only runs `vite build`, which checks no types and runs no
    # tests — a type error or a broken test in lessons_ui/ used to ship unnoticed.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lessons_ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lessons_ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.app.json
      - name: Unit tests
        run: npx vitest run
