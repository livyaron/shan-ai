<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shan-AI — קביעת סיסמה</title>
  <style>
    :root { --bg: #0b100d; --ink: #d5dfd8; --ink2: #96a39b; --panel: #131a16; --acc: #00a86b; --err: #ef6b6b; --line: #26332c; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; font-family: 'Heebo', 'Segoe UI', Arial, sans-serif; background: var(--bg); color: var(--ink); }
    .card { width: 100%; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 16px; }
    h1 { font-size: 22px; font-weight: 700; }
    p { color: var(--ink2); font-size: 14px; line-height: 1.6; }
    label { display: grid; gap: 6px; font-size: 13px; color: var(--ink2); }
    input { width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line); background: #0e1411; color: var(--ink); font-size: 16px; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
    #code { direction: ltr; text-align: center; letter-spacing: 0.4em; font-family: 'JetBrains Mono', Consolas, monospace; }
    button { padding: 12px; border: 0; border-radius: 8px; background: var(--acc); color: #04140c; font-size: 16px; font-weight: 700; cursor: pointer; }
    .err { color: var(--err); font-size: 14px; }
    a { color: var(--ink2); font-size: 13px; text-align: center; }
    form { display: grid; gap: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>קביעת סיסמה אישית</h1>
    <p>שלחנו קוד אימות בן 6 ספרות לחשבון הטלגרם שלך. הקוד תקף ל־10 דקות. הסיסמה הראשונית אינה מאפשרת כניסה למערכת.</p>
    {% if error %}<div class="err" role="alert">❌ {{ error }}</div>{% endif %}
    <form method="POST" action="/login/new-password" autocomplete="off">
      <input type="hidden" name="user_id" value="{{ user_id }}">
      {% if next_url %}<input type="hidden" name="next" value="{{ next_url }}">{% endif %}
      <label>קוד האימות מטלגרם
        <input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus>
      </label>
      <label>סיסמה חדשה (לפחות {{ min_length }} תווים)
        <input id="new_password" type="password" name="new_password" minlength="{{ min_length }}" required autocomplete="new-password">
      </label>
      <label>הקלד שוב את הסיסמה החדשה
        <input id="confirm" type="password" name="confirm" minlength="{{ min_length }}" required autocomplete="new-password">
      </label>
      <button type="submit">שמור סיסמה והיכנס</button>
    </form>
    <a href="/login">חזרה למסך הכניסה</a>
  </main>
</body>
</html>
